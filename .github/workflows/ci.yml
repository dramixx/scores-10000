name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit -- --run

  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Debug adapter resolution
        run: |
          node -e "import('@sveltejs/adapter-node').then(m => console.log('adapter-node module path resolves; adapter().name =', m.default().name)).catch(e => console.log('IMPORT FAILED', e))"
          npm ls @sveltejs/adapter-node @sveltejs/adapter-static @sveltejs/kit 2>&1 || true
          find / -xdev -iname "*adapter-static*" -not -path "/proc/*" 2>/dev/null || true
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Build
        run: |
          # This project's toolchain (Vite 8 / Rolldown) has occasionally produced
          # an incomplete build in CI (adapter-node's output missing) without
          # failing the build command itself. Verify the expected server entry
          # exists and retry once if not, rather than let Playwright fail later
          # with a confusing "connection refused" / "module not found" error.
          npm run build
          if [ ! -f build/index.js ]; then
            echo "::warning::build/index.js missing after build, retrying once"
            rm -rf build .svelte-kit
            npm run build
          fi
          test -f build/index.js
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: scores-10000:ci
