server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	# Immutable hashed build assets: cache forever.
	location /_app/immutable/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		try_files $uri =404;
	}

	# Service worker and manifest must always be revalidated so PWA updates land.
	location ~* ^/(sw\.js|workbox-.*\.js|manifest\.webmanifest|registerSW\.js)$ {
		add_header Cache-Control "no-cache";
		try_files $uri =404;
	}

	# SPA fallback: unknown paths (e.g. /game/<id>) resolve client-side.
	location / {
		try_files $uri $uri/ /index.html;
	}
}
